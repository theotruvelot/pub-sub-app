name: Build and Deploy API

on:
    push:
        branches: ["maalsi24"]
        paths:
            - 'RabbitMqProductAPI/**'
    workflow_dispatch:

env: 
    workdir: "RabbitMqProductAPI"
    dockerregistry: ${{ secrets.DOCKER_HOSTNAME }}
    IMAGE_NAME: "ttruvelot/pubsub-app"
jobs:

  deploy-api:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true
      - uses: mr-smithers-excellent/docker-build-push@v6
        name: Build & Push image
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: "latest"
          dockerfile: ${{ env.workdir }}/Dockerfile
          directory: ${{ env.workdir }}
          registry: ${{ env.dockerregistry }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          

          
    
    
        

